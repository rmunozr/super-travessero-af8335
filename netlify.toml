[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."reminders"]
  schedule = "*/15 * * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"



[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/rag-api-proxy?path=/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rag/app"
  to = "/.netlify/functions/rag-ui?path=index"
  status = 200
  force = true

[[redirects]]
  from = "/rag/app/*"
  to = "/.netlify/functions/rag-ui?path=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rag"
  to = "/rag.html"
  status = 200

[[headers]]
  for = "/rag"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/rag/app/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
