<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Deep Finance Lab · Mini RAG</title>
  <style>
    :root{--bg:#07111f;--panel:#0b1b31;--line:#24598f;--text:#eef8ff;--muted:#88b4d8;--primary:#0093c9;--primary2:#38bdf8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(430px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
    .brand{font-size:12px;font-weight:800;letter-spacing:.16em}
    .muted{color:var(--muted)}
    h1{font-size:28px;margin:12px 0 6px}
    label{display:block;font-size:11px;color:var(--muted);margin:13px 0 5px}
    input,button{font:inherit}
    input{width:100%;min-height:44px;background:#071522;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px}
    button{cursor:pointer}
    .primary{width:100%;min-height:44px;margin-top:16px;border:1px solid var(--primary2);border-radius:9px;background:var(--primary);color:#fff;font-weight:800}
    .error{color:#ffabab;font-size:12px;margin-top:10px;display:none}
  </style>
</head>
<body>
<section class="login">
  <form id="loginForm" class="card">
    <div class="brand">DEEP FINANCE LAB</div>
    <h1>Mini RAG</h1>
    <div class="muted">Acceso privado</div>

    <label for="email">Usuario</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button class="primary" type="submit">ENTRAR</button>
    <div id="error" class="error"></div>
  </form>
</section>

<script>
(()=>{
  const form=document.getElementById('loginForm');
  const error=document.getElementById('error');

  async function auth(method='GET',body){
    const r=await fetch('/.netlify/functions/rag-auth',{
      method,
      headers:{'content-type':'application/json'},
      body:body?JSON.stringify(body):undefined,
      credentials:'same-origin',
      cache:'no-store'
    });
    return {ok:r.ok,data:await r.json().catch(()=>({}))};
  }

  async function enter(){
    const health=await fetch('/.netlify/functions/rag-api-proxy?path=health',{
      credentials:'same-origin',
      cache:'no-store'
    });
    if(!health.ok) throw new Error('BACKEND_UNAVAILABLE');

    location.replace('/rag/app/?release=9.1.3-v83-live-inline-r4');
  }

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    error.style.display='none';

    const r=await auth('POST',{
      email:document.getElementById('email').value,
      password:document.getElementById('password').value
    });

    if(!r.ok){
      error.textContent='Usuario o contraseña incorrectos.';
      error.style.display='block';
      return;
    }

    try{
      await enter();
    }catch{
      error.textContent='Backend Mini RAG no disponible.';
      error.style.display='block';
    }
  });

  (async()=>{
    try{
      const s=await auth();
      if(s.ok && s.data.authenticated) await enter();
    }catch{}
  })();
})();
</script>
</body>
</html>
